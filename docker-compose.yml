services:
  postgres:
    image: postgres:16-alpine
    container_name: catalogo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-catalogo_db}
      POSTGRES_USER: ${PGUSER:-catalogo_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-localdev_password}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-catalogo_user} -d ${PGDATABASE:-catalogo_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
